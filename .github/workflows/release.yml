name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'tag to create, e.g. v5.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: macos-universal
          - os: ubuntu-22.04
            asset: x86_64-unknown-linux-gnu
          - os: windows-latest
            asset: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: name the build after the tag
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            v='${{ inputs.version }}'
          else
            v='${{ github.ref_name }}'
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          sed -i.bak -E "s/^version = .*/version = \"${v#v}\"/" Cargo.toml && rm -f Cargo.toml.bak
          grep -qx "version = \"${v#v}\"" Cargo.toml

      - name: rust
        run: rustup update stable && rustup default stable

      - name: mac targets
        if: matrix.os == 'macos-14'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: build (macOS, both architectures in one binary)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist/atvtools.app/Contents/MacOS dist/atvtools.app/Contents/Resources
          lipo -create -output dist/atvtools \
            target/aarch64-apple-darwin/release/atvtools \
            target/x86_64-apple-darwin/release/atvtools
          cp dist/atvtools dist/atvtools.app/Contents/MacOS/atvtools-bin
          cat > dist/atvtools.app/Contents/MacOS/atvtools << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/atvtools-bin" gui
          EOF
          chmod +x dist/atvtools.app/Contents/MacOS/atvtools
          cat > dist/atvtools.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>atvtools</string>
            <key>CFBundleIdentifier</key><string>com.adam2893.atvtools</string>
            <key>CFBundleName</key><string>atvtools</string>
            <key>CFBundleVersion</key><string>${VERSION#v}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          cp README.md dist/
          tar -czf "atvtools-${VERSION}-macos-universal.tar.gz" -C dist atvtools atvtools.app README.md

      - name: build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
          cargo build --release
          mkdir -p dist
          cp target/release/atvtools README.md dist/
          tar -czf "atvtools-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C dist atvtools README.md

      - name: build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/atvtools.exe README.md dist/
          printf '@echo off\r\nstart "" "%%~dp0atvtools.exe" gui\r\n' > dist/atvtools-gui.bat
          cd dist
          powershell -NoProfile -Command 'Compress-Archive -Path atvtools.exe, atvtools-gui.bat, README.md -DestinationPath "../atvtools-$env:VERSION-x86_64-pc-windows-msvc.zip"'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: atvtools-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            v='${{ inputs.version }}'
          else
            v='${{ github.ref_name }}'
          fi
          ls -l dist
          gh release create "$v" dist/* --title "$v" --generate-notes
